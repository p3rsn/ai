<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial';
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
            background: #ffffff;
        }

        #chat-container.active {
            display: block;
        }

        .message {
            max-width: 70%;
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            animation: fadeIn 0.2s ease-in;
            font-size: 14px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #e8e8e8;
            margin-left: auto;
            color: #333;
        }

        .message.ai {
            background: #f9f9f9;
            margin-right: auto;
            border: 1px solid #e0e0e0;
            color: #333;
        }

        #input-wrapper {
            padding: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }

        #input-wrapper.centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            background: transparent;
            border: none;
        }

        #input-wrapper.bottom {
            background: #ffffff;
        }

        #input-form {
            display: flex;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        #user-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        #user-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
        }

        #send-btn {
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #357abd;
        }

        #send-btn:active {
            background: #2868a8;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            max-width: 60px;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    
    <div id="input-wrapper" class="centered">
        <div id="input-form">
            <input 
                type="text" 
                id="user-input" 
                placeholder="ask ai" 
                autocomplete="off"
            />
            <button type="button" id="send-btn">go</button>
        </div>
    </div>

    <script>
        // ============================================
        // STEP 1: PUT YOUR GROQ API KEY HERE
        // ============================================
        // Go to https://console.groq.com/keys
        // Click "Create API Key"
        // Copy the key and paste it between the quotes below:
        
        const GROQ_API_KEY = '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';
        
        // ============================================
        
        const chatContainer = document.getElementById('chat-container');
        const inputWrapper = document.getElementById('input-wrapper');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isFirstMessage = true;
        let conversationHistory = [];

        async function handleSend() {
            const message = userInput.value.trim();
            if (!message) return;

            // Check if API key is set
            if (GROQ_API_KEY === 'YOUR_API_KEY_HERE') {
                alert('Please add your Groq API key first! Open the HTML file in a text editor and follow the instructions at the top of the script.');
                return;
            }

            // Move input to bottom on first message
            if (isFirstMessage) {
                inputWrapper.classList.remove('centered');
                inputWrapper.classList.add('bottom');
                chatContainer.classList.add('active');
                isFirstMessage = false;
            }

            // Add user message
            addMessage(message, 'user');
            conversationHistory.push({
                role: 'user',
                content: message
            });
            
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingIndicator = showTypingIndicator();

            try {
                // Call Groq API
                const aiResponse = await getGroqResponse(conversationHistory);
                
                // Remove typing indicator
                typingIndicator.remove();

                // Add AI response
                addMessage(aiResponse, 'ai');
                conversationHistory.push({
                    role: 'assistant',
                    content: aiResponse
                });
            } catch (error) {
                typingIndicator.remove();
                addMessage('Sorry, I encountered an error: ' + error.message, 'ai');
                console.error('Error details:', error);
            }
            
            sendBtn.disabled = false;
            userInput.focus();
        }

        // Handle button click
        sendBtn.addEventListener('click', handleSend);

        // Handle Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        async function getGroqResponse(messages) {
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.3-70b-versatile',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful AI assistant. Your name is simply "AI". Keep your responses concise and helpful. Be friendly but professional.'
                            },
                            ...messages
                        ],
                        temperature: 0.7,
                        max_tokens: 1000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `API error: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.choices || data.choices.length === 0) {
                    throw new Error('No response received from AI');
                }

                return data.choices[0].message.content;
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return indicator;
        }

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
