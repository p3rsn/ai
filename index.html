<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <title>ai</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial';
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: none;
            background: #ffffff;
        }

        #chat-container.active {
            display: block;
        }

        .message {
            max-width: 70%;
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            animation: fadeIn 0.2s ease-in;
            font-size: 14px;
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: #e8e8e8;
            margin-left: auto;
            color: #333;
        }

        .message.ai {
            background: #f9f9f9;
            margin-right: auto;
            border: 1px solid #e0e0e0;
            color: #333;
            white-space: pre-wrap;
        }

        .message code {
            background: #e8e8e8;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .message pre {
            background: #2d2d2d;
            color: #f8f8f8;
            padding: 12px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message pre code {
            background: transparent;
            padding: 0;
            color: #f8f8f8;
        }

        .message strong {
            font-weight: 600;
        }

        .message em {
            font-style: italic;
        }

        .message a {
            color: #4a90e2;
            text-decoration: none;
        }

        .message a:hover {
            text-decoration: underline;
        }

        .message ul, .message ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message li {
            margin: 4px 0;
        }

        #input-wrapper {
            padding: 16px;
            transition: all 0.3s ease;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }

        #input-wrapper.centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            background: transparent;
            border: none;
        }

        #input-wrapper.bottom {
            background: #ffffff;
        }

        #input-form {
            display: flex;
            gap: 8px;
            max-width: 900px;
            margin: 0 auto;
        }

        #user-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            background: #fff;
        }

        #user-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
        }

        #send-btn {
            padding: 10px 20px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #357abd;
        }

        #send-btn:active {
            background: #2868a8;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background: transparent; /* Removed background for a cleaner look */
            margin-bottom: 12px;
        }

        .typing-indicator .spinner-square {
            width: 16px;
            height: 16px;
            border: 2px solid #333; /* Black outline */
            background: transparent;
            animation: spin-square 1.2s infinite ease-in-out;
        }

        @keyframes spin-square {
            0% { 
                transform: rotate(0deg); 
            }
            50% { 
                transform: rotate(180deg); 
                border-radius: 2px; /* Slight softening during turn */
            }
            100% { 
                transform: rotate(360deg); 
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        #cooldown-timer::before {
            content: ". . .";
            display: block;
            animation: pulse 1.5s infinite;
            margin-bottom: 2px;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    
    <div id="input-wrapper" class="centered">
        <div id="input-form">
            <input type="text" id="user-input" placeholder="ask ai" autocomplete="off" />
            <button type="button" id="send-btn">go</button>
        </div>
        <div id="cooldown-timer" style="display: none; text-align: center; font-size: 12px; font-family: 'Courier New', monospace; margin-top: 8px; color: #666;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/base128-encoding@2.0.2/dist/index.min.js"></script>
    <script>
        import Base128 from 'base128-encoding';
        
        const KK = Base128.decodeStr ('3\\m5z	i<^LU#92p%jsJa"K*hu:Hy1heIU"1"RF6JI,n*Y	KEBk+HsKUJv');
        
        // ============================================
        
        const chatContainer = document.getElementById('chat-container');
        const inputWrapper = document.getElementById('input-wrapper');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let isFirstMessage = true;
        let conversationHistory = [];

        const cooldownDisplay = document.getElementById('cooldown-timer');
        let cooldownActive = false;
        
        async function handleSend() {
            const message = userInput.value.trim();
            if (!message || cooldownActive) return;


            // Move input to bottom on first message
            if (isFirstMessage) {
                inputWrapper.classList.remove('centered');
                inputWrapper.classList.add('bottom');
                chatContainer.classList.add('active');
                isFirstMessage = false;
            }

            // Add user message
            addMessage(message, 'user');
            conversationHistory.push({
                role: 'user',
                content: message
            });
            
            userInput.value = '';
            sendBtn.disabled = true;

            // Show typing indicator
            const typingIndicator = showTypingIndicator();

            try {
                // Call Groq API
                const aiResponse = await getGroqResponse(conversationHistory);
                
                // Remove typing indicator
                typingIndicator.remove();

                // Add AI response
                addMessage(aiResponse, 'ai');
                conversationHistory.push({
                    role: 'assistant',
                    content: aiResponse
                });
            } catch (error) {
                typingIndicator.remove();
                addMessage('error: ' + error.message, 'ai');
                addMessage('further error details: ' + error, 'ai');
            }
            
            sendBtn.disabled = false;
            userInput.focus();
            startCooldown(12.5);
        }

        function startCooldown(seconds) {
            cooldownActive = true;
            userInput.disabled = true;
            sendBtn.disabled = true;
            cooldownDisplay.style.display = 'block';
        
            let remaining = seconds;
            
            const interval = setInterval(() => {
                remaining -= 0.1;
                cooldownDisplay.innerText = remaining.toFixed(1) + "s";
        
                if (remaining <= 0) {
                    clearInterval(interval);
                    cooldownActive = false;
                    userInput.disabled = false;
                    sendBtn.disabled = false;
                    cooldownDisplay.style.display = 'none';
                    userInput.focus();
                }
            }, 100); // Updates every 100ms for a smooth decimal countdown
        }

        // Handle button click
        sendBtn.addEventListener('click', handleSend);

        // Handle Enter key
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        async function getGroqResponse(messages) {
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${KK}`
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [
                            {
                                role: 'system',
                                content: 'You are a helpful AI assistant. Your name is simply "AI". Keep your responses concise and helpful. Be friendly but professional.'
                            },
                            ...messages
                        ],
                        temperature: 0.7,
                        max_tokens: 4000
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error?.message || `API error: ${response.status}`);
                }

                const data = await response.json();
                
                if (!data.choices || data.choices.length === 0) {
                    throw new Error('No response received from AI');
                }

                return data.choices[0].message.content;
            } catch (error) {
                console.error('API call failed:', error);
                throw error;
            }
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            if (sender === 'ai') {
                // Parse markdown for AI messages
                messageDiv.innerHTML = parseMarkdown(text);
            } else {
                // Plain text for user messages
                messageDiv.textContent = text;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function parseMarkdown(text) {
            // Escape HTML first
            text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Code blocks (```)
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });
            
            // Inline code (`)
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            
            // Bold (**text** or __text__)
            text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/__(.+?)__/g, '<strong>$1</strong>');
            
            // Italic (*text* or _text_)
            text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
            text = text.replace(/_(.+?)_/g, '<em>$1</em>');
            
            // Links [text](url)
            text = text.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
            
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            
            // Unordered lists
            text = text.replace(/^[\*\-]\s+(.+)$/gm, '<li>$1</li>');
            text = text.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
            
            // Ordered lists
            text = text.replace(/^\d+\.\s+(.+)$/gm, '<li>$1</li>');
            
            return text;
        }

        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            // Changed from three spans to one div for the square
            indicator.innerHTML = '<div class="spinner-square"></div>';
            chatContainer.appendChild(indicator);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return indicator;
        }

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
